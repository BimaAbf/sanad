# Local development stack for مِسك (Misk).
# Nothing here needs a credential from outside this file.
#
# Host ports are offset into the 5xxxx range so this stack can run alongside
# another project's postgres/redis/minio on the same machine. Container-internal
# ports are the standard ones. See docs/adr/001-stack.md.
name: misk

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: misk
      POSTGRES_PASSWORD: misk
      POSTGRES_DB: misk
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misk -d misk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: miskminio
      MINIO_ROOT_PASSWORD: miskminio-dev-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 miskminio miskminio-dev-secret &&
      mc mb --ignore-existing local/misk-media &&
      mc mb --ignore-existing local/misk-private &&
      echo 'buckets ready'
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "51025:1025"
      - "58025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
