# Local development stack for سند (Sanad).
# Nothing here needs a credential from outside this file.
#
# Host ports are offset into the 5xxxx range so this stack can run alongside
# another project's postgres/redis/minio on the same machine. Container-internal
# ports are the standard ones. See docs/adr/001-stack.md.
name: sanad

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: sanad
      POSTGRES_DB: sanad
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad -d sanad"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sanadminio
      MINIO_ROOT_PASSWORD: sanadminio-dev-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A one-shot bucket creator, not a service. The profile keeps it out of the
  # default `docker compose up`, because `--wait` treats ANY container that
  # exits as a failed start -- even one that exits 0 having done its job:
  #
  #   - Container sanad-minio-init-1  Waiting
  #   container sanad-minio-init-1 exited (0)
  #   error: recipe `bootstrap` failed
  #
  # That broke `just bootstrap` and `just up` alike, with every container
  # actually healthy. Run it explicitly instead:
  #
  #   docker compose run --rm minio-init
  #
  # which waits for completion and returns its exit code. `mc mb
  # --ignore-existing` makes it idempotent, so re-running costs nothing.
  minio-init:
    image: minio/mc:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sanadminio sanadminio-dev-secret &&
      mc mb --ignore-existing local/sanad-media &&
      mc mb --ignore-existing local/sanad-private &&
      echo 'buckets ready'
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "51025:1025"
      - "58025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
